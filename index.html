.races-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.race-card{background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:19px;padding:23px;position:relative;overflow:hidden}.race-card:after{content:"";position:absolute;width:170px;height:170px;border:32px solid #f3f6f8;right:-100px;top:-95px;border-radius:50%;pointer-events:none}.race-icon{height:47px;width:47px;border-radius:15px;background:#fff1ea;color:#d18e74;display:grid;place-items:center}.race-icon.lime{background:#eff9e8;color:#7cab78}.race-icon.violet{background:#f0edff;color:#a294d9}.race-icon .icon{width:25px;height:25px}.race-date{font-weight:850;letter-spacing:1.4px;color:#99a5b3;font-size:10px;margin-top:22px}.race-card h3{font:750 21px/1.2 Outfit,sans-serif;margin:7px 0 4px}.race-card .distance{font:800 40px/1.1 Outfit,sans-serif;margin:19px 0 13px;letter-spacing:-1.2px}.race-card p{font-size:12px;color:#8693a3;margin:0}.race-goal{background:#f7f9fa;border-radius:12px;padding:12px;margin-top:19px;font-size:11px;color:#607185;min-height:72px}.race-goal strong{display:block;color:#2e4156;margin-bottom:4px}.race-link{margin-top:19px;display:inline-flex;align-items:center;gap:7px;font-weight:800;color:#637b8f;font-size:11px}.race-link:hover{color:#172a45}.pace-table{width:100%;border-collapse:collapse;font-size:13px}.pace-table tr+tr td,.pace-table tr+tr th{border-top:1px solid var(--line)}.pace-table td,.pace-table th{padding:15px 9px;text-align:left}.pace-table th{color:#68788e;font-weight:700}.pace-table strong{font:750 19px Outfit,sans-serif}.strategy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.strategy-item{background:#f8fafb;border:1px solid #edf1f3;border-radius:13px;padding:17px}.strategy-item strong{display:block;font:750 17px Outfit,sans-serif;margin:4px 0}.strategy-item p{margin:0;font-size:11px;color:#7b8a9b;line-height:1.6}

.cal-milestone:hover{background:rgba(255,255,255,.115);transform:translateY(-2px)}

.cal-insights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

const CAL_STAGES=[

function calPeriod(start,end){
 const ds=PLAN.days.filter(d=>d.date>=start&&d.date<=end);
 const sessions=ds.filter(eligible);
 const done=sessions.filter(d=>consideredDone(d.date)).length;
 const skipped=sessions.filter(d=>entryStatus(d.date)==='skipped').length;
 const actual=ds.reduce((n,d)=>n+doneKm(d),0);
 const planned=ds.reduce((n,d)=>n+(d.km||0),0);
 return {total:sessions.length,done,skipped,actual,planned,percent:sessions.length?Math.round(done/sessions.length*100):0};
}

function weekIndexForDate(date){return WEEKS.findIndex(w=>w.start<=date&&date<=w.dateEnd);}

function closeModal(){const el=document.getElementById('dialog-root');if(el)el.innerHTML='';state.modalDate=null;document.body.style.overflow='';}
function updateEntry(date,patch,refresh=true){if(!DAY_MAP[date])return;state.entries[date]={...entryFor(date),...patch,updated_at:new Date().toISOString()};persistEntries();scheduleSync();if(refresh){render();if(state.modalDate)openModal(state.modalDate);}}
function configReady(){try{const u=new URL(state.config.url);return u.protocol==='https:'&&!!state.config.key&&state.config.key.length>12;}catch{return false;}}
function saveConfig(){const url=document.getElementById('sb-url')?.value.trim().replace(/\/$/,'')||'';const key=document.getElementById('sb-key')?.value.trim()||'';if(url&&(!url.startsWith('https://')||!key)){notify('Introduce una URL HTTPS y una clave pública válida.');return;}if(state.session&&url!==state.config.url){notify('Cierra sesión antes de cambiar de proyecto Supabase.');return;}state.config={url,key};localStorage.setItem(CONFIG_KEY,JSON.stringify(state.config));notify('Conexión guardada en este navegador.');render();}
let runningSync=false, queuedSync=false,syncTimer=null;
function scheduleSync(){if(!state.session?.user?.id||!configReady())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncCloud(),850);}
function setSync(kind,error=''){state.syncState=kind;state.syncError=error;updateSync();}
async function authCall(path,data){if(!configReady())throw new Error('Faltan la URL y la clave pública de Supabase.');const res=await fetch(`${state.config.url}/auth/v1/${path}`,{method:'POST',headers:{'apikey':state.config.key,'Content-Type':'application/json'},body:JSON.stringify(data)});let body={};try{body=await res.json();}catch{}if(!res.ok)throw new Error(body.error_description||body.msg||body.message||`Error de autenticación (${res.status})`);return body;}
function persistSession(sess,remember=state.rememberSession){
 state.session=sess;
 state.rememberSession=!!remember;
 const store=state.rememberSession?localStorage:sessionStorage;
 const other=state.rememberSession?sessionStorage:localStorage;
 store.setItem(SESSION_KEY,JSON.stringify(sess));
 other.removeItem(SESSION_KEY);
}
function clearStoredSession(){
 localStorage.removeItem(SESSION_KEY);
 sessionStorage.removeItem(SESSION_KEY);
 state.session=null;
}
async function refreshSession(){
 if(!state.session?.refresh_token)throw new Error('La sesión caducó; vuelve a iniciar sesión.');
 const oldUser=state.session.user;
 let result;
 try{
   result=await authCall('token?grant_type=refresh_token',{refresh_token:state.session.refresh_token});
 }catch(err){
   const msg=String(err?.message||'');
   if(/invalid.*refresh|refresh.*(not found|expired|invalid|revoked)|session.*(expired|revoked|not found)|invalid_grant/i.test(msg)){
     clearStoredSession();
     state.entries=loadEntries(GUEST_KEY);
     state.entryDismissed=false;
     state.entryMode='login';
     state.entryFeedback={type:'error',text:'La sesión ha caducado o se ha revocado. Inicia sesión de nuevo para continuar.'};
     renderShell();
   }
   throw err;
 }
 if(!result.access_token||!result.refresh_token)throw new Error('No se ha recibido una sesión renovada.');
 const session={access_token:result.access_token,refresh_token:result.refresh_token,expires_at:Date.now()+(result.expires_in||3600)*1000,user:result.user||oldUser};
 persistSession(session);
}
async function ensureSession(){if(!state.session?.access_token)throw new Error('Inicia sesión para sincronizar.');if(state.session.expires_at&&Date.now()>state.session.expires_at-120000)await refreshSession();}
async function api(tablePath,method='GET',payload,refreshAllowed=true){await ensureSession();const headers={'apikey':state.config.key,'Authorization':`Bearer ${state.session.access_token}`,'Content-Type':'application/json'};if(method==='POST')headers.Prefer='resolution=merge-duplicates,return=minimal';const options={method,headers};if(payload!==undefined)options.body=JSON.stringify(payload);let res=await fetch(`${state.config.url}/rest/v1/${tablePath}`,options);if(res.status===401&&refreshAllowed){await refreshSession();return api(tablePath,method,payload,false);}if(!res.ok){let json={};try{json=await res.json();}catch{}throw new Error(json.message||json.error||`Error de sincronización ${res.status}. Revisa tabla y políticas RLS.`);}if(res.status===204||method==='POST')return null;return res.json();}
function latestMerge(remote,local){let combined={...remote};for(let [date,e] of Object.entries(local)){if(!DAY_MAP[date]||!e||typeof e!=='object')continue;const t1=Date.parse(e.updated_at||'1970-01-01');const t2=Date.parse(combined[date]?.updated_at||'1970-01-01');if(!combined[date]||t1>=t2)combined[date]=e;}return combined;}
async function syncCloud(){if(!state.session?.user?.id||!configReady())return;if(runningSync){queuedSync=true;return;}runningSync=true;setSync('syncing');try{let uid=state.session.user.id;const rows=await api(`running_entries?user_id=eq.${encodeURIComponent(uid)}&select=day_key,status,actual_km,rpe,note,result_time,updated_at`);let remote={};for(const r of (rows||[])){remote[r.day_key]={status:r.status||'pending',actual_km:r.actual_km===null?null:Number(r.actual_km),rpe:r.rpe,note:r.note||'',result_time:r.result_time||'',updated_at:r.updated_at};}
let local=latestMerge(loadEntries(entryKey()),state.entries);let merged=latestMerge(remote,local);const upload=Object.entries(merged).filter(([date,e])=>{const other=remote[date];return !other||Date.parse(e.updated_at||'1970-01-01')>Date.parse(other.updated_at||'1970-01-01');}).map(([day_key,e])=>({user_id:uid,day_key,status:e.status||'pending',actual_km:e.actual_km===undefined||e.actual_km===''?null:e.actual_km,rpe:e.rpe===undefined||e.rpe===''?null:e.rpe,note:String(e.note||'').slice(0,1200),result_time:String(e.result_time||'').slice(0,12),updated_at:e.updated_at||new Date().toISOString()}));
if(upload.length){await api('running_entries?on_conflict=user_id,day_key','POST',upload);}state.entries=latestMerge(merged,loadEntries(entryKey()));persistEntries();state.lastSync=new Date().toISOString();setSync('synced');if(state.tab!=='settings'&&!state.modalDate)render();if(state.tab==='settings')render();
}catch(err){setSync('error',err.message||'Error no identificado');if(state.tab==='settings')render();console.warn('Sincronización no disponible:',err);}finally{runningSync=false;if(queuedSync){queuedSync=false;setTimeout(syncCloud,1100);}}}

function authFeedback(message,type='error'){
 if(!state.session&&!state.entryDismissed){
   state.entryFeedback={type,text:String(message)};
   state.entryBusy=false;
   renderShell();
 }else notify(message);
}
async function runAuth(mode){
 if(state.entryBusy)return;
 const email=document.getElementById('auth-email')?.value.trim()||'';
 const password=document.getElementById('auth-password')?.value||'';
 const remember=document.getElementById('auth-remember')?.checked!==false;
 const gateway=!state.session&&!state.entryDismissed;
 state.entryEmail=email;
 state.rememberSession=remember;
 if(!email||!email.includes('@')||password.length<8){
   authFeedback('Introduce un correo válido y una contraseña de 8 caracteres como mínimo.');
   return;
 }
 const button=gateway?document.getElementById('auth-entry-submit'):document.querySelector('[data-action="'+mode+'"]');
 if(button)button.disabled=true;
 state.entryBusy=true;
 try{
   const body=await authCall(mode==='signup'?'signup':'token?grant_type=password',{email,password});
   if(!body.access_token){
     state.entryMode='login';
     authFeedback('Cuenta creada. Si recibes un correo de Supabase, confírmalo y después inicia sesión.','success');
     return;
   }
   const session={access_token:body.access_token,refresh_token:body.refresh_token,expires_at:Date.now()+(body.expires_in||3600)*1000,user:body.user};
   if(!session.user?.id||!session.refresh_token)throw new Error('No se ha recibido una sesión válida.');
   const guest=loadEntries(GUEST_KEY);
   persistSession(session,remember);
   state.entries=latestMerge(loadEntries(entryKey()),guest);
   persistEntries();
   if(Object.keys(guest).length)localStorage.removeItem(GUEST_KEY);
   state.entryFeedback=null;
   state.entryMode='login';
   state.entryBusy=false;
   renderShell();
   notify('¡Sesión iniciada! Sincronizando tus entrenamientos…');
   await syncCloud();
 }catch(err){
   authFeedback('No se ha podido acceder: '+String(err?.message||err));
 }finally{
   state.entryBusy=false;
   if(button&&button.isConnected)button.disabled=false;
 }
}
async function logout(){
 const token=state.session?.access_token;
 const url=state.config.url,key=state.config.key;
 clearStoredSession();
 state.entries=loadEntries(GUEST_KEY);
 state.syncState='local';
 state.syncError='';
 state.lastSync=null;
 state.entryDismissed=false;
 state.entryMode='login';
 state.entryEmail='';
 state.entryFeedback={type:'success',text:'Has cerrado sesión en este dispositivo. Tus entrenamientos siguen guardados en tu cuenta.'};
 state.rememberSession=true;
 renderShell();
 if(token&&configReady()){
   try{
     await fetch(url+'/auth/v1/logout?scope=local',{
       method:'POST',
       headers:{'apikey':key,'Authorization':'Bearer '+token}
     });
   }catch(err){
     // The browser has already discarded the session even when offline.
   }
 }
}
function exportEntries(){let result={app:'Aurrera Running',version:PLAN.version,exportedAt:new Date().toISOString(),entries:state.entries};const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`mi-diario-running-${nowDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Diario exportado como JSON.');}
async function importEntries(file){try{if(file.size>2_000_000)throw new Error('Archivo demasiado grande.');const txt=await file.text();const obj=JSON.parse(txt);if(!obj||typeof obj.entries!=='object'||Array.isArray(obj.entries))throw new Error('No es una copia de seguridad válida.');const incoming={};for(const [date,e] of Object.entries(obj.entries)){if(DAY_MAP[date]&&e&&typeof e==='object'){incoming[date]={status:['pending','done','skipped'].includes(e.status)?e.status:'pending',actual_km:e.actual_km??null,rpe:e.rpe??null,note:String(e.note||'').slice(0,1200),result_time:String(e.result_time||'').slice(0,12),updated_at:e.updated_at||new Date().toISOString()};}}state.entries=latestMerge(state.entries,incoming);persistEntries();scheduleSync();render();notify(`Se han importado ${Object.keys(incoming).length} registros.`);}catch(e){notify(`No se pudo importar: ${e.message}`);}}
function moveMonth(step){let[y,m]=state.month.split('-').map(Number);let d=new Date(Date.UTC(y,m-1+step,1,12));let n=d.toISOString().slice(0,7);if(n>='2026-10'&&n<='2027-02'){state.month=n;let first=PLAN.days.find(x=>x.date.startsWith(n));if(first)state.selectedDate=first.date;render();}}
function selectCalendarDay(date){state.selectedDate=date;state.calWeekIndex=weekIndexForDate(date);state.month=date.slice(0,7);render();if(window.matchMedia('(max-width:830px)').matches)openModal(date);}
document.addEventListener('submit',async e=>{
 if(e.target.id!=='auth-entry-form')return;
 e.preventDefault();
 await runAuth(state.entryMode==='signup'?'signup':'login');
});
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action;
if(act==='auth-toggle'){
 state.entryEmail=document.getElementById('auth-email')?.value.trim()||state.entryEmail;
 state.rememberSession=document.getElementById('auth-remember')?.checked!==false;
 state.entryMode=state.entryMode==='login'?'signup':'login';
 state.entryFeedback=null;
 renderShell();
 return;
}
if(act==='auth-guest'){
 state.entryDismissed=true;
 state.entryFeedback=null;
 renderShell();
 return;
}
if(act==='auth-remember-toggle'){
 if(state.session){
   persistSession(state.session,!state.rememberSession);
   render();
   notify(state.rememberSession?'Tu sesión permanecerá iniciada en este dispositivo.':'Esta sesión solo durará mientras mantengas abierta la sesión del navegador.');
 }
 return;
}
if(act==='nav'){switchTab(btn.dataset.tab);return;}
if(act==='home-week'){focusWeek(state.weekIndex+Number(btn.dataset.step));render();return;}
if(act==='calendar-week'){focusWeek(state.calWeekIndex+Number(btn.dataset.step));render();return;}
if(act==='calendar-jump-week'){focusWeek(Number(btn.dataset.index));state.calMode='week';render();document.getElementById('cal-main')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(act==='calendar-race'){const ix=weekIndexForDate(btn.dataset.date);if(ix>=0){focusWeek(ix);state.selectedDate=btn.dataset.date;state.calMode='week';render();document.getElementById('cal-main')?.scrollIntoView({behavior:'smooth',block:'start'});}return;}
if(act==='calendar-toggle-done'){const date=btn.dataset.date;const d=DAY_MAP[date];if(!d||!eligible(d))return;const done=consideredDone(date);updateEntry(date,{status:done?'pending':'done'});notify(done?'Entrenamiento desmarcado.':'¡Entrenamiento completado! Tu progreso se ha actualizado.');return;}
if(act==='go-week'){focusWeek(Number(btn.dataset.index));switchTab('calendar');return;}
if(act==='pick-day'){if(!DAY_MAP[btn.dataset.date])return;state.selectedDate=btn.dataset.date;render();return;}
if(act==='open-day'){openModal(btn.dataset.date);return;}
if(act==='close-modal'){closeModal();return;}
if(act==='set-status'){updateEntry(btn.dataset.date,{status:btn.dataset.status});notify(btn.dataset.status==='done'?'¡Sesión completada!':btn.dataset.status==='skipped'?'Sesión marcada como no realizada.':'Estado restablecido.');return;}
if(act==='calendar-mode'){state.calMode=btn.dataset.mode;render();return;}
if(act==='select-calendar-day'||act==='select-month-day'){selectCalendarDay(btn.dataset.date);return;}
if(act==='today'){state.selectedDate=DAY_MAP[nowDate()]?nowDate():PLAN.start;const i=weekIndexForDate(state.selectedDate);state.calWeekIndex=Math.max(0,i);state.month=state.selectedDate.slice(0,7);render();return;}
if(act==='change-month'){moveMonth(Number(btn.dataset.step));return;}
if(act==='save-config'){saveConfig();return;}
if(act==='login'||act==='signup'){await runAuth(act);return;}
if(act==='logout'){await logout();return;}
if(act==='sync-now'){await syncCloud();notify(state.syncState==='synced'?'Sincronización completada.':'No se pudo sincronizar. Revisa la configuración.');return;}
if(act==='export'){exportEntries();return;}
if(act==='import'){document.getElementById('import-file')?.click();return;}
if(act==='share-link'){if(location.protocol==='https:'){try{await navigator.clipboard.writeText(location.href);notify('Enlace copiado. Ábrelo desde el móvil.');}catch{notify('No se ha podido copiar el enlace.');}}else notify('Primero publica esta web con HTTPS para tener un enlace compartible.');}
});
document.addEventListener('input',e=>{const input=e.target.closest('[data-entry-field]');if(!input)return;const key=input.dataset.entryField;const date=input.dataset.date;let value=input.value;if(key==='rpe')value=value===''?null:Math.max(1,Math.min(10,Number(value)));if(key==='actual_km')value=value===''?null:Math.max(0,Math.min(100,Number(value)||0));if(key==='note')value=value.slice(0,1200);if(key==='result_time')value=value.slice(0,12);updateEntry(date,{[key]:value},false);if(key==='actual_km')calRefreshDistance();});
document.addEventListener('change',async e=>{if(e.target.id==='import-file'&&e.target.files?.[0]){await importEntries(e.target.files[0]);e.target.value='';}});
document.addEventListener('click',e=>{if(e.target?.dataset?.overlay)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modalDate)closeModal();});
window.addEventListener('focus',()=>{if(state.session)syncCloud();});
window.addEventListener('online',()=>{if(state.session)syncCloud();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.session)syncCloud();});
setInterval(()=>{if(document.visibilityState==='visible'&&state.session)syncCloud();},60000);
renderShell();
if(state.session&&configReady())syncCloud();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script>
